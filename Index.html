<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Your Name] - Digital Marketing Analyst</title>
    <meta name="description" content="Results-driven Digital Marketing Analyst specializing in SEO, SEM, and Social Media strategies.">

    <!-- Font Awesome CDN for Icons --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJ8g3S3pMfeJceJ52V1B+F5iY4YF0i4iJ6E1Z5J5I5N5z5v5z5b5w5" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* --- Global Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* A very light grey */
            color: #333;
            line-height: 1.6;
            scroll-behavior: smooth; 
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- Header & Navigation --- */
        header {
            background-color: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #007bff; /* Professional Blue */
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav li {
            margin-left: 25px;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
            display: flex; 
            align-items: center;
        }

        nav a:hover, nav a.active {
            color: #007bff;
        }
        
        nav a i {
            margin-right: 8px;
            color: #007bff; /* Color the icon blue */
            font-size: 1.1rem;
        }

        /* --- Sections --- */
        section {
            padding: 80px 0;
        }

        section h2 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.4rem;
            color: #2c3e50; /* Dark blue/grey */
        }

        /* --- Hero Section (Home) --- */
        #home {
            background-color: #ffffff;
            text-align: center;
            padding: 100px 0;
        }

        #home h1 {
            font-size: 3.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        #home .subtitle {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 50px; /* Pill shape */
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .cta-button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* --- About Section --- */
        #about {
            background-color: #ffffff;
        }

        .about-content {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .about-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #007bff;
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 1.5rem;
            color: #007bff;
            margin-bottom: 15px;
        }

        /* --- Services/Skills Section --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.07);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .service-card .icon {
            font-size: 3rem;
            color: #007bff;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        /* --- Case Studies (Portfolio) Section --- */
        #case-studies {
            background-color: #f8f9fa; /* Light grey */
        }
        
        .case-study-card {
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.07);
        }
        
        .case-study-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        
        .case-study-content {
            padding: 25px;
        }
        
        .case-study-content h3 {
            margin-top: 0;
            color: #007bff;
        }

        .case-study-content .result {
            font-size: 1.5rem;
            font-weight: 700;
            color: #28a745; /* Green for success */
            margin-bottom: 10px;
        }
        
        .case-study-content p {
            margin-bottom: 15px;
        }
        
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #e9ecef;
            color: #555;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* --- Contact Section --- */
        #contact {
            background-color: #ffffff;
            text-align: center;
        }

        #contact p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        /* --- Footer --- */
        footer {
            background-color: #2c3e50;
            color: #f4f4f4;
            text-align: center;
            padding: 30px 0;
            margin-top: 60px;
        }


        /* ========================================
         --- ENHANCED RESPONSIVE STYLES --- 
         ========================================
        */
        @media (max-width: 768px) {
            
            nav {
                flex-direction: column;
                align-items: flex-start;
            }

            nav ul {
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
            }

            nav li {
                margin: 8px 0;
                margin-left: 0;
            }
            
            nav a {
                 padding: 5px 0; 
            }
            
            nav a i {
                font-size: 1.2rem;
            }

            #home h1 {
                font-size: 2.5rem;
            }

            #home .subtitle {
                font-size: 1.1rem;
            }

            .about-content {
                flex-direction: column;
                text-align: center;
            }

            section {
                padding: 60px 0;
            }

            section h2 {
                font-size: 2rem;
            }

            .case-study-content .result {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
